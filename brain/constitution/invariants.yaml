      - brain/tests/test_transcript_normalize.py
      - brain/tests/test_session_ingest_grounding.py
    teeth: true
    gold_eval: null
    parity: false
    live_smoke: false

  - id: INV-ENTITY-01
    statement: "Secret-shaped token names never become entities"
    source: "V-04"
