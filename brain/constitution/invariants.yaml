      - brain/tests/test_entity_extractor.py
    teeth: true
    gold_eval: null
    parity: false
    live_smoke: false

  - id: INV-ENTITY-02
    statement: "Junk and hub entity names are filtered (deg1/hub caps)"
    source: "V-07 V-10"
    tests:
      - brain/tests/test_entity_extractor.py
    teeth: true
    gold_eval: null
    parity: false
    live_smoke: false

  - id: INV-DEPLOY-01
